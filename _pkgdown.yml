url: https://insightsurge.github.io/hovercraft/
destination: site

template:
  bootstrap: 5
  light-switch: true
  bslib:
    bg: "#F5FAFC"
    fg: "#172E36"
    primary: "#145C68"
    link-color: "#145C68"
    link-color-dark: "#8CE1E4"

navbar:
  structure:
    left: [reference, news, articles]
    right: [search, github, lightswitch]

reference:
  - title: Put a tip on a tag
    contents:
      - tip_on
  - title: Drive a tip from the server (experimental)
    contents:
      - tip_server
  - title: Tips on tables (experimental)
    contents:
      - tip_table
      - tip_spec
  - title: Templates
    contents:
      - tip_define
      - tip_template
      - tip_blocks
      - tip_output
  - title: Looks
    contents:
      - tip_style
      - tip_presets
      - tip_theme
      - tip_marker
  - title: The engine
    contents: tip_dependency
