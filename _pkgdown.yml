url: https://insightsurge.github.io/hovercraft/
destination: site

# Slots for the design pass (logo, favicon, social card, fonts): no images ship yet.
#   logo:      man/figures/logo.png  (pkgdown also finds favicons in pkgdown/favicon/)
#   social card: add template.opengraph.image (src and alt) when the card exists.
template:
  bootstrap: 5
  light-switch: true
  bslib:
    bg: "#F5FAFC"
    fg: "#172E36"
    primary: "#145C68"
    link-color: "#145C68"
    link-color-dark: "#8CE1E4"

home:
  links:
    - text: Security policy
      href: SECURITY.html

navbar:
  components:
    intro:
      text: Get started
      href: articles/hovercraft.html
    guides:
      text: Guides
      menu:
        - text: Tips in a Shiny app
          href: articles/shiny.html
        - text: Tips on tables
          href: articles/tables.html
        - text: A short tip with a long form
          href: articles/long-form.html
        - text: Themes and looks
          href: articles/themes.html
        - text: "The book: try every feature"
          href: articles/the-book.html
        - text: -------
        - text: All articles
          href: articles/index.html
  structure:
    left: [intro, guides, reference, news]
    right: [search, github, lightswitch]

reference:
  - title: Put a tip on a tag
    desc: The one call most pages need, and the long form of a tip.
    contents:
      - tip_on
      - tip_more
  - title: Write what a tip says
    desc: Name a template once, build it from blocks, and fill it from a record.
    contents:
      - tip_define
      - tip_template
      - tip_blocks
      - tip_output
  - title: Tips on tables
    desc: Tips on the rows, cells and headers of a DT or reactable table.
    contents:
      - tip_table
      - tip_spec
  - title: Drive tips from the server
    desc: Open, close and change a tip from a Shiny server function.
    contents:
      - tip_server
  - title: Set up the page and its look
    desc: Add the engine to a page, and choose how tips look, from a preset name to your own colours.
    contents:
      - use_hovercraft
      - tip_presets
      - tip_style
      - tip_theme
      - tip_marker
  - title: Try every feature
    contents:
      - hovercraft_book
  - title: Package
    contents:
      - hovercraft-package

articles:
  - title: Get started
    contents:
      - hovercraft
  - title: Guides
    contents:
      - articles/shiny
      - articles/tables
      - articles/long-form
      - themes
      - articles/the-book
