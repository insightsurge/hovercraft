url: https://insightsurge.github.io/hovercraft/
destination: site

template:
  bootstrap: 5
  light-switch: true
  bslib:
    bg: "#F5FAFC"
    fg: "#172E36"
    primary: "#145C68"
    link-color: "#145C68"
    link-color-dark: "#8CE1E4"

navbar:
  structure:
    left: [reference, news, articles]
    right: [search, github, lightswitch]

reference:
  - title: Stable, in 0.1.x
    desc: >
      Put a tip on a tag, name its templates, set up the page. These keep their names, values and defaults.
  - subtitle: Put a tip on a tag
    contents:
      - tip_on
  - subtitle: Templates
    contents:
      - tip_define
      - tip_template
      - tip_blocks
  - subtitle: The page and its look by name
    contents:
      - use_hovercraft
      - tip_presets
  - title: Experimental
    desc: >
      These may change in a later 0.x release; the help says which arguments of a stable function are in this group.
  - subtitle: The long form
    contents:
      - tip_more
  - subtitle: Tips on tables
    contents:
      - tip_table
      - tip_spec
  - subtitle: Drive a tip from the server
    contents:
      - tip_server
  - subtitle: Live outputs in a tip
    contents:
      - tip_output
  - subtitle: Looks as objects
    contents:
      - tip_style
      - tip_theme
      - tip_marker
  - subtitle: The book
    contents: hovercraft_book
